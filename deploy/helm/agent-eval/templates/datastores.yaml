{{- if .Values.postgres.enabled }}
# Dev-only Postgres (ephemeral storage). Production uses RDS via postgres.externalUrl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aep.name" . }}-postgres
  labels: {{- include "aep.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels: {{- include "aep.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aep.name" . }}-postgres
  labels: {{- include "aep.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
# Dev-only Redis. Production uses ElastiCache via redis.externalUrl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aep.name" . }}-redis
  labels: {{- include "aep.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: {{- include "aep.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aep.name" . }}-redis
  labels: {{- include "aep.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
{{- end }}
