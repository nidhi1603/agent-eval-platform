[project]
name = "agent-eval-platform"
version = "0.1.0"
description = "Run LLM-agent benchmark trials as isolated Kubernetes Jobs and measure reliability (pass^k) and cost."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "kubernetes>=31.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
bench = [
    "tau2[knowledge]",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "b7ea9074c1cba482b30687fecdb5c8425fd6f619" }
